[project]
name = "distillery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sbussiso", email = "sbussiso321@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "litellm>=1.96.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
distillery = "distillery:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"
